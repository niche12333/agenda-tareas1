<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda de tareas con ficha de presentación">
  <title>Agenda de tareas · Proyecto final</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <div>
      <h1>Agenda de tareas</h1>
      <p class="subtitulo">Proyecto final · Desarrollo Web I</p>
    </div>
    <button id="btn-tema" type="button" aria-pressed="false">🌙 Modo oscuro</button>
  </header>

  <nav class="menu" aria-label="Secciones y materias">
    <ul id="menu-lista"></ul>
  </nav>

  <main id="contenido" class="layout" tabindex="-1">
    <!-- Vista: Inicio -->
    <div id="vista-inicio" class="vista">
    <!-- Hoja de presentación -->
    <section class="bloque" aria-labelledby="t-ficha">
      <h2 id="t-ficha" tabindex="-1">Mi ficha</h2>

      <article id="tarjeta" class="tarjeta">
        <h3 id="tarjeta-nombre"></h3>
        <p id="tarjeta-programa"></p>
        <p id="tarjeta-correo"></p>
        <blockquote id="tarjeta-frase"></blockquote>
      </article>

      <form id="form-ficha" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Su nombre completo">

        <label for="programa">Programa</label>
        <input type="text" id="programa" name="programa" placeholder="Ej: Técnico en software">

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" autocomplete="email" placeholder="correo@ejemplo.com">

        <label for="frase">Frase</label>
        <input type="text" id="frase" name="frase" placeholder="Una frase que lo describa">

        <button type="submit">Guardar ficha</button>
        <p id="mensaje" class="mensaje" role="status"></p>
      </form>
    </section>

    <!-- Resumen por materia -->
    <section class="bloque" aria-labelledby="t-resumen">
      <h2 id="t-resumen">Mis materias</h2>
      <ul id="lista-materias" class="materias"></ul>
    </section>
    </div>

    <!-- Vista: una materia (el contenido cambia según la pestaña elegida) -->
    <div id="vista-materia" class="vista" hidden>
    <section class="bloque" aria-labelledby="t-materia">
      <h2 id="t-materia" tabindex="-1"></h2>

      <form id="form-tarea" novalidate>
        <label for="titulo-tarea">Nueva tarea</label>
        <div class="fila">
          <input type="text" id="titulo-tarea" name="titulo" placeholder="¿Qué tiene pendiente?">
          <button type="submit">Agregar</button>
        </div>
        <p id="mensaje-tarea" class="mensaje" role="status"></p>
      </form>

      <div class="filtros" role="group" aria-label="Filtrar tareas">
        <button type="button" data-filtro="todas" class="activo" aria-pressed="true">Todas</button>
        <button type="button" data-filtro="pendientes" aria-pressed="false">Pendientes</button>
        <button type="button" data-filtro="completadas" aria-pressed="false">Completadas</button>
      </div>

      <p id="contador" class="contador" role="status"></p>
      <ul id="lista-tareas" class="lista"></ul>
    </section>
    </div>
  </main>

  <footer class="pie">
    <p>Hecho con HTML, CSS y JavaScript · Datos guardados en su navegador</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
